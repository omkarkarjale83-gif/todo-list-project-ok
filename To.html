<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>
    <style>
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .task-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #taskInput {
            flex: 10;
            padding: 10px;
            border: 1px solid #780d0d;
            border-radius: 4px;
        }

        #addTaskBtn {
            padding: 10px 20px;
            background-color: orange;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #addTaskBtn:hover {
            background-color: #ff6600;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>

        <div class="task-input">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task"
            >

            <button id="addTaskBtn">Add Task</button>
        </div>

        <h2>Task List</h2>

        <ul id="taskList">
            
        </ul>

    </div>

    <script src="script.js"></script>

</body>

</html>
